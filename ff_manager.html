<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEET FUEL Manager</title>
    <link rel="stylesheet" href="ff_manager.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
   
</head>
<body>
 <header>
    <h1>Fleet Fuel &amp; Expense Manager</h1>
           <!-- Menu -->
      <nav>
      <button data-tab="dashboard" class="active">Dashboard</button>
      <button data-tab="vehicles">Vehicles</button>
      <button data-tab="refuelling">Refuelling</button>
      <button data-tab="expenses">Expenses</button></nav></header>
      <main>
    <!-- Filter bar  -->
    <div class="card row">
      <label> Vehicle<select id="filterVehicle"></select> </label>
      <label> From<span class="date-wrap" data-placeholder="Select date">
          <input type="date" id="filterFrom"></span> </label>
      <label> To<span class="date-wrap" data-placeholder="Select date">
          <input type="date" id="filterTo"> </span></label>
      <button id="clearFilters">Clear filters</button>
      <button id="exportRefuels" class="main-btn">Export refuels CSV</button>
      <button id="exportExpenses" class="main-btn">Export expenses CSV</button>
      <button id="printBtn">Print report</button>
      <button id="resetDemo">Reset demo data</button></div>

                       <!--  DASHBOARD  -->
     <section class="screen active" id="dashboard">
      <!-- The 8 boxes are filled by using JavaScript -->
      <div class="kpi-grid" id="kpiBox"></div>
      <div class="chart-grid">
        <div class="card">
          <h3>Average fuel economy by vehicle (km/L)</h3>
          <canvas id="chartEconomy"></canvas> </div>
        <div class="card"><h3>Monthly fuel cost trend (Rs)</h3>
          <canvas id="chartTrend"></canvas> </div></div>
      <div class="card"> <h3>Vehicle summary</h3>
        <div class="table-wrap" id="summaryTable"></div></div></section>

                       <!-- FORM FOR MAINTENANCE-->
    <section class="screen" id="vehicles">
      <div class="card">
        <h3 id="vehicleTitle">Add vehicle</h3>
        <form id="vehicleForm" class="row">
          <input type="hidden" id="vehicleId">
          <label> Registration / ID<input id="vehicleReg" required></label>
          <label> Make / model<input id="vehicleModel" required></label>
          <label> Type<select id="vehicleType">
              <option>Hatchback</option>
              <option>Sedan</option>
              <option>SUV</option>
              <option>Pickup</option>
              <option>Van</option>
              <option>Truck</option>
              <option>Motorcycle</option></select></label>
          <label> Fuel<select id="vehicleFuel">
              <option>Petrol</option>
              <option>Diesel</option>
              <option>CNG</option>
              <option>Hybrid</option> </select></label>
          <label> Notes (optional) <input id="vehicleNotes"> </label>
          <button class="main-btn">Save vehicle</button>
          <button type="button" id="vehicleCancel">Cancel</button></form></div>
      <div class="card table-wrap" id="vehicleList"></div> </section>

                             <!-- REFUELLING PAGE -->
    <section class="screen" id="refuelling">
      <div class="card">
        <h3>Record refuelling</h3>
        <form id="refuelForm" class="row">
          <label> Vehicle <select id="refuelVehicle" required></select></label>
          <label> Date &amp; time <span class="date-wrap" data-placeholder="Select date and time">
            <input type="datetime-local" id="refuelDate" required></span></label>
          <label> Odometer (km)<input type="number" id="refuelOdo" min="0" step="1" required></label>
          <label> Litres<input type="number" id="refuelLitres" min="0" step="0.01" required></label>
          <label> Price / litre (Rs)<input type="number" id="refuelPrice" value="377" min="0" step="0.01" required></label>
          <label> Receipt total (Rs) <input type="number" id="refuelTotal" min="0" step="1"></label>
          <label> Full tank?<select id="refuelFull">
              <option value="yes">Yes</option>
              <option value="no">No (partial)</option> </select></label>
          <button class="main-btn">Add record</button>
          <span id="refuelCalc" class="light-text"></span> </form> </div>
      <div class="card table-wrap" id="refuelList"></div></section>
                 <!-- FORM FOR MAINTENANCE-->
      <section class="screen" id="expenses">
      <div class="card">
        <h3>Add Maintenance / Expense</h3>
        <form id="expenseForm" class="row">
          <label> Vehicle <select id="expenseVehicle" required></select></label>
          <label> Date <span class="date-wrap" data-placeholder="Select date">
              <input type="date" id="expenseDate" required>
            </span></label>
          <label> Category <select id="expenseCategory">
              <option>Maintenance</option>
              <option>Tyres</option>
              <option>Insurance</option>
              <option>Tolls / parking</option>
              <option>Repairs</option>
              <option>Other</option>
            </select></label>
          <label> Amount (Rs) <input type="number" id="expenseAmount" min="1" required></label>
          <label> Notes
            <input id="expenseNotes"> </label>
          <button class="main-btn">Add expense</button>
        </form></div>
      <div class="card table-wrap" id="expenseList"></div>
    </section>
  </main>
    <script src="ff_manager.js"></script>
</body>
</html>
